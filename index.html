<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>The Odin Project - Calculator</title>
		<link rel="stylesheet" href="style.css" />
		<script src="script.js" defer></script>
	</head>
	<body>
		<div class="calculator-body">
			<div class="display">0</div>
			<div class="first-row">
				<button id="clear">Clear</button>
				<button class="operator">÷</button>
				<button class="operator">x</button>
			</div>
			<div class="cluster">
				<div id="numbers">
					<div class="number">
						<button>7</button>
						<button>8</button>
						<button>9</button>
					</div>
					<div class="number">
						<button>4</button>
						<button>5</button>
						<button>6</button>
					</div>
					<div class="number">
						<button>1</button>
						<button>2</button>
						<button>3</button>
					</div>
					<div class="number">
						<button id="zero">0</button>
						<button id="decimal">.</button>
					</div>
				</div>
				<div class="operators">
					<button class="operator">-</button>
					<button class="operator">+</button>
					<button class="calculate">=</button>
				</div>
			</div>
		</div>
	</body>
</html>
